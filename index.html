<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股選股篩選</title>
<style>
:root{color-scheme:dark;--bg:#171b28;--card:#222839;--tx:#f2f4f8;--mu:#9aa3b8;--bd:#313a54;--up:#ff6b6b;--dn:#34d399;--ac:#ff5a68;--ac2:#ff8a5c;--soft:rgba(255,90,104,.13);--sh:0 2px 10px rgba(0,0,0,.28)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 40px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:22px;box-shadow:var(--sh)}
h1{font-size:22px;margin:0;letter-spacing:.5px;line-height:1.2}
.meta{color:var(--mu);font-size:12.5px}.sub{color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;box-shadow:var(--sh)}
.btn:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-1px)}
.btn.primary{background:var(--ac);color:#fff;border-color:transparent}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.sm{padding:5px 12px;font-size:13px;box-shadow:none}
.warn{background:#fff4d6;color:#7a5200;padding:10px 14px;border-radius:12px;margin-bottom:14px;display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-bottom:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px}
input[type=text],input[type=number],select{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--soft)}
.bar select{width:auto}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px;align-items:center}
.presets>span{color:var(--mu);font-size:12.5px}
.chipb{padding:5px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.chipb:hover{background:var(--soft);border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 14px;border-bottom:1px solid var(--bd);padding-bottom:10px}
.tab{padding:7px 14px;border-radius:10px;border:0;background:transparent;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover,.tab.on{background:var(--soft);color:var(--ac)}
.tab i{font-style:normal;margin-left:6px;background:var(--ac);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.grp{display:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.grp.on{display:grid}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mu)}
.chk{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:var(--bg);color:var(--tx);font-size:13.5px;transition:.15s}
.chk:hover{border-color:var(--ac)}
.chk input{accent-color:var(--ac);width:16px;height:16px;margin:0}
.chk:has(input:checked){background:var(--soft);border-color:var(--ac);color:var(--ac);font-weight:600}
.cnt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:baseline;margin:0 2px 10px}
.cnt b{font-size:19px}
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;font-variant-numeric:tabular-nums}
th{cursor:pointer;color:var(--mu);font-weight:600;font-size:12.5px;user-select:none}
th:hover,th.cur{color:var(--ac)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left;position:sticky;background:var(--card);z-index:1}
th:first-child,td:first-child{left:0;min-width:68px}
th:nth-child(2),td:nth-child(2){left:68px;box-shadow:2px 0 4px rgba(0,0,0,.05)}
.code{font-weight:700}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
.norow td{text-align:center!important;position:static!important;color:var(--mu);padding:44px}
.up{color:var(--up)}.dn{color:var(--dn)}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--bg);color:var(--mu);margin-left:4px}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:18px 0 4px}
.pg{min-width:38px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.pg:hover{border-color:var(--ac);color:var(--ac)}
.pg.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pg:disabled{opacity:.4;cursor:default;border-color:var(--bd);color:var(--mu)}
svg{vertical-align:middle}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:18px;max-width:920px;width:100%;padding:18px;max-height:95vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rg{display:flex;gap:6px}
#tip{min-height:22px;margin-top:8px}
@media (max-width:640px){.wrap{padding:12px 10px 30px}h1{font-size:19px}.card{padding:12px}}

.top{position:sticky;top:0;z-index:20;background:rgba(31,35,48,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.top .in{max-width:1180px;margin:auto;padding:0 16px;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.logo2{font-size:18px;letter-spacing:.5px;white-space:nowrap}.logo2 b{font-weight:800}.logo2 i{font-style:normal;margin-right:8px;color:var(--ac)}
.top nav{display:flex;gap:26px}
.top nav a{color:var(--tx);text-decoration:none;font-size:13.5px;letter-spacing:.5px;padding:6px 0;border-bottom:2px solid transparent;transition:.15s}
.top nav a:hover,.top nav a.on{color:var(--ac)}
.top nav a.on{border-bottom-color:var(--ac)}
.top .meta{text-align:right;font-size:12px}
.banner{padding:68px 16px 60px;background:
 radial-gradient(circle at 16% 30%,rgba(255,160,90,.20),transparent 42%),
 radial-gradient(circle at 84% 72%,rgba(90,130,255,.24),transparent 46%),
 repeating-linear-gradient(35deg,rgba(255,255,255,.04) 0 2px,transparent 2px 44px),
 repeating-linear-gradient(-55deg,rgba(255,255,255,.04) 0 2px,transparent 2px 62px),
 linear-gradient(180deg,#252c42,#171b28);border-bottom:1px solid var(--bd)}
.banner .in{max-width:1180px;margin:auto}
.banner h1{font-size:clamp(30px,5.2vw,54px);line-height:1.22;font-weight:800;letter-spacing:1px;margin:0 0 14px}
.banner h1 span{color:var(--ac)}
.banner p{margin:0 0 26px;font-size:clamp(14px,1.8vw,18px);color:#d5dae6;letter-spacing:.5px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta .btn{padding:11px 26px;border-radius:999px}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{border-color:var(--ac);color:var(--ac)}
.foot{margin-top:40px;padding:20px 16px;background:#1f2330;border-top:1px solid var(--bd);text-align:center;color:var(--mu);font-size:12px}
@media (max-width:640px){.top .in{grid-template-columns:auto 1fr;height:auto;padding:10px 12px}.top .meta{display:none}.top nav{justify-content:flex-end;gap:16px}.banner{padding:44px 14px 40px}}
.star{cursor:pointer;color:var(--mu);margin-right:6px;font-size:15px;user-select:none}.star:hover{color:#fbbf24}.star.on{color:#fbbf24}
th:first-child,td:first-child{min-width:96px}th:nth-child(2),td:nth-child(2){left:96px}
.mychip{display:inline-flex;align-items:center}.mychip b{cursor:pointer;color:var(--mu);font-size:12px;padding:0 6px}.mychip b:hover{color:var(--ac)}
#sb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:14px}
.dcell{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.dcell span{font-size:11.5px;color:var(--mu)}.dcell b{font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo2"><i>▲</i><b>台股</b> 選股</div>
  <nav><a class="on" href="index.html">選股篩選</a><a href="analysis.html">分析工具</a></nav>
  <div class="meta" id="meta">載入中…</div>
</div></header>
<section class="banner"><div class="in">
  <h1>用數據篩出你的<span>下一檔</span><br>強勢好股</h1>
  <p>技術指標、籌碼、基本面一次篩選，再用歷史回測比較策略</p>
  <div class="cta"><a class="btn primary" href="#flt">開始篩選</a><a class="btn ghost" href="analysis.html">📊 分析工具</a></div>
</div></section>
<div class="wrap" style="padding-top:26px">
<div class="warn" id="warn">找不到 data/screener.json，目前顯示的是隨機產生的示範資料，不代表真實行情。</div>

<div class="card" id="flt">
  <div class="bar">
    <div class="search"><input type="text" id="f_q" placeholder="🔍 搜尋代號或名稱，例如 2330 或 台積電"></div>
    <select id="f_m"><option value="">上市＋上櫃</option><option>上市</option><option>上櫃</option></select>
    <button class="btn" id="rs">↺ 重設條件</button>
  </div>
  <div class="presets" id="presets"></div>
  <div class="presets" id="mine"></div>
  <div class="tools"><button class="btn sm" id="wl">⭐ 只看自選（0）</button><button class="btn sm" id="bt">🧪 回測這組條件</button><button class="btn sm" id="sh">🔗 複製分享連結</button><button class="btn sm" id="ex">⬇ 匯出 CSV</button></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-g="tech" data-l="技術面">技術面</button>
    <button class="tab" data-g="ind" data-l="MACD・KD・布林">MACD・KD・布林</button>
    <button class="tab" data-g="fund" data-l="基本面">基本面</button>
    <button class="tab" data-g="chip" data-l="籌碼面">籌碼面</button>
    <button class="tab" data-g="oth" data-l="其他">其他</button>
  </div>
  <div class="grp on" data-g="tech">
    <label class="chk"><input type="checkbox" id="f_ma20">收盤價站上 20 日線</label>
    <label class="chk"><input type="checkbox" id="f_ma60">收盤價站上 60 日線</label>
    <label class="chk"><input type="checkbox" id="f_bull">均線多頭（5日＞20日＞60日）</label>
    <label class="chk"><input type="checkbox" id="f_brk">突破 20 日新高</label>
    <label class="fld">爆量倍數 ≥<input type="number" id="f_vr" step="0.1" placeholder="如 2"></label>
    <label class="fld">RSI(14) 最小<input type="number" id="f_rmin" placeholder="如 50"></label>
    <label class="fld">RSI(14) 最大<input type="number" id="f_rmax" placeholder="如 70"></label>
  </div>
  <div class="grp" data-g="ind">
    <label class="chk"><input type="checkbox" id="f_mx">MACD 黃金交叉（今日）</label>
    <label class="chk"><input type="checkbox" id="f_mo">MACD 柱狀體 ＞ 0</label>
    <label class="chk"><input type="checkbox" id="f_mz">DIF 在零軸之上</label>
    <label class="chk"><input type="checkbox" id="f_kx">KD 黃金交叉（今日）</label>
    <label class="chk"><input type="checkbox" id="f_kl">K 值 ＜ 20（低檔）</label>
    <label class="chk"><input type="checkbox" id="f_bu">突破布林上軌</label>
    <label class="chk"><input type="checkbox" id="f_bl">跌破布林下軌</label>
    <label class="fld">布林帶寬 ≤（%）<input type="number" id="f_bw" placeholder="如 8"></label>
  </div>
  <div class="grp" data-g="fund">
    <label class="fld">殖利率 ≥（%）<input type="number" id="f_dy" step="0.1" placeholder="如 5"></label>
    <label class="fld">本益比 ≤<input type="number" id="f_pe" placeholder="如 15"></label>
    <label class="fld">股價淨值比 ≤<input type="number" id="f_pb" step="0.1" placeholder="如 1.5"></label>
    <label class="fld">月營收年增率 ≥（%）<input type="number" id="f_rv" placeholder="如 20"></label>
    <label class="fld">月營收月增率 ≥（%）<input type="number" id="f_rm" placeholder="如 0"></label>
    <label class="fld">最新 EPS ≥（元）<input type="number" id="f_eps" step="0.1" placeholder="如 1"></label>
  </div>
  <div class="grp" data-g="chip">
    <label class="fld">外資連續買超 ≥（天）<input type="number" id="f_fs" placeholder="如 3"></label>
    <label class="fld">投信連續買超 ≥（天）<input type="number" id="f_ts" placeholder="如 3"></label>
    <label class="fld">外資近 5 日買超 ≥（張）<input type="number" id="f_f5" placeholder="如 1000"></label>
    <div class="meta" style="align-self:center">※ 法人資料目前僅含上市股票</div>
  </div>
  <div class="grp" data-g="oth">
    <label class="chk"><input type="checkbox" id="f_etf" checked>排除 ETF（代號 00 開頭）</label>
    <label class="fld">最低股價（元）<input type="number" id="f_p" placeholder="如 10"></label>
    <label class="fld">最低成交量（張）<input type="number" id="f_v" placeholder="如 1000"></label>
  </div>
</div>

<div class="cnt" id="cnt"></div>
<div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="bd"></tbody></table></div>
<div class="pager" id="pager"></div>
<div class="meta" style="text-align:center;margin-top:14px">資料來源：證交所、櫃買中心。僅供研究參考，不構成投資建議。</div>
</div>

<div class="modal" id="md"><div class="mbox">
  <div class="mh"><div><b id="mt" style="font-size:16px"></b> <span id="mp"></span></div><div class="rg"><button class="btn sm" id="mst"></button><a class="btn sm" id="mcmp" href="analysis.html">⚖ 與其他股票比較</a></div>
  <div class="rg" id="rg"></div><button id="mx" class="btn sm">✕ 關閉</button></div>
  <div id="sb"></div><div id="ch"></div><div class="sub" id="lg"><span style="color:#f59e0b">━ 5日線</span>　<span style="color:#2563eb">━ 20日線</span>　<span style="color:#9333ea">━ 60日線</span>　下方柱狀為成交量</div>
  <div id="tip"></div><div id="dt"></div></div></div>
<div class="foot">資料來源：臺灣證券交易所、櫃買中心公開資料。僅供研究參考，不構成投資建議。</div>
<script>
const COLS=[["c","代號"],["n","名稱"],["close","收盤"],["pct","漲跌%"],["vol","成交量(張)"],["vr","量比"],
["ma20","20MA"],["ma60","60MA"],["rsi","RSI"],["pe","本益比"],["dy","殖利率%"],["pb","淨值比"],["fb","外資(張)"],["fs","外資連買"],["ts","投信連買"],["rv","營收YoY%"],["eps","EPS"],["osc","MACD柱"],["k","K"],["bp","布林%B"],["spark","30日"]];
let DATA=[],sk="vol",asc=false;
const $=id=>document.getElementById(id), val=id=>{const v=$(id).value;return v===""?null:+v};

async function load(){
  try{const r=await fetch("data/screener.json",{cache:"no-store"});if(!r.ok)throw 0;
    const j=await r.json();DATA=j.stocks;DATE=j.updated;$("meta").textContent=`資料日期：${j.updated}　共 ${DATA.length} 檔（上市+上櫃，每日收盤後更新）`;}
  catch(e){DATA=demo();$("warn").style.display="block";$("meta").textContent="示範資料";}
  init();
  const hm=location.hash.match(/[#&]f=([^&]+)/);if(hm){try{applyF(JSON.parse(decodeURIComponent(hm[1])))}catch(e){}}
}
function demo(){const a=[];for(let i=0;i<300;i++){let p=20+Math.random()*300,s=[];
  for(let k=0;k<30;k++){p*=1+(Math.random()-.48)*.03;s.push(+p.toFixed(2))}
  const m=n=>+(s.slice(-n).reduce((x,y)=>x+y,0)/Math.min(n,s.length)).toFixed(2);
  a.push({c:String(1101+i),n:"示範"+(i+1),m:i%3?"上市":"上櫃",close:s[29],pct:+((s[29]/s[28]-1)*100).toFixed(2),
  vol:Math.floor(Math.random()*5e7),pe:+(5+Math.random()*30).toFixed(1),dy:+(Math.random()*8).toFixed(2),
  pb:+(.5+Math.random()*4).toFixed(2),ma5:m(5),ma20:m(20),ma60:m(30),vr:+(.3+Math.random()*3).toFixed(2),
  rsi:+(20+Math.random()*60).toFixed(1),brk:Math.random()<.1,spark:s})}return a}

function spark(s){if(!s||s.length<2)return"";const mn=Math.min(...s),mx=Math.max(...s),w=80,h=22;
  const pts=s.map((v,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-(v-mn)/((mx-mn)||1)*h).toFixed(1)}`).join(" ");
  const up=s[s.length-1]>=s[0];return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(${up?"--up":"--dn"})" stroke-width="1.5"/></svg>`}

function filt(){
  const q=$("f_q").value.trim().toLowerCase(),m=$("f_m").value;
  const vr=val("f_vr"),rmin=val("f_rmin"),rmax=val("f_rmax"),dy=val("f_dy"),pe=val("f_pe"),pb=val("f_pb"),p=val("f_p"),v=val("f_v");
  const bwv=val("f_bw"),fs=val("f_fs"),ts=val("f_ts"),f5=val("f_f5"),rv=val("f_rv"),rm=val("f_rm"),ep=val("f_eps");
  return DATA.filter(s=>{
    if(m&&s.m!==m)return false;
    if($("f_etf").checked&&/^00/.test(s.c))return false;
    if(onlyWL&&!WL.has(s.c))return false;
    if(q&&!(s.c.includes(q)||s.n.toLowerCase().includes(q)))return false;
    if($("f_ma20").checked&&!(s.ma20&&s.close>s.ma20))return false;
    if($("f_ma60").checked&&!(s.ma60&&s.close>s.ma60))return false;
    if($("f_bull").checked&&!(s.ma5&&s.ma20&&s.ma60&&s.ma5>s.ma20&&s.ma20>s.ma60))return false;
    if($("f_brk").checked&&!s.brk)return false;
    if(vr!=null&&!(s.vr!=null&&s.vr>=vr))return false;
    if(rmin!=null&&!(s.rsi!=null&&s.rsi>=rmin))return false;
    if(rmax!=null&&!(s.rsi!=null&&s.rsi<=rmax))return false;
    if(dy!=null&&!(s.dy!=null&&s.dy>=dy))return false;
    if(pe!=null&&!(s.pe!=null&&s.pe>0&&s.pe<=pe))return false;
    if(pb!=null&&!(s.pb!=null&&s.pb<=pb))return false;
    if(p!=null&&s.close<p)return false;
    if(v!=null&&s.vol/1000<v)return false;
    if(fs!=null&&!(s.fs!=null&&s.fs>=fs))return false;
    if(ts!=null&&!(s.ts!=null&&s.ts>=ts))return false;
    if(f5!=null&&!(s.f5!=null&&s.f5>=f5))return false;
    if(rv!=null&&!(s.rv!=null&&s.rv>=rv))return false;
    if(rm!=null&&!(s.rm!=null&&s.rm>=rm))return false;
    if(ep!=null&&!(s.eps!=null&&s.eps>=ep))return false;
    if($("f_mx").checked&&!s.mx)return false;
    if($("f_mo").checked&&!(s.osc>0))return false;
    if($("f_mz").checked&&!s.mz)return false;
    if($("f_kx").checked&&!s.kx)return false;
    if($("f_kl").checked&&!(s.k<20))return false;
    if($("f_bu").checked&&!(s.bp>1))return false;
    if($("f_bl").checked&&!(s.bp<0))return false;
    if(bwv!=null&&!(s.bw!=null&&s.bw<=bwv))return false;
    return true});
}
const PS=10;let PG=1,DATE="",onlyWL=false;

let HIST=null,INST=null,CUR=null,CURC=null,RNG=66,SUB="vol",BOLL=false;
async function getHist(){if(HIST)return HIST;try{const r=await fetch("data/history.json");if(!r.ok)throw 0;HIST=await r.json()}catch(e){HIST={}}return HIST}
async function getInst(){if(INST)return INST;try{const r=await fetch("data/inst.json");if(!r.ok)throw 0;INST=await r.json()}catch(e){INST={}}return INST}
const ema=(a,n)=>{const k=2/(n+1);let e=null;return a.map(v=>e=e==null?v:v*k+e*(1-k))};
const kdArr=cl=>{let k=50,d=50;const K=[],D=[];for(let i=0;i<cl.length;i++){if(i>=8){const w=cl.slice(i-8,i+1),lo=Math.min(...w),hi=Math.max(...w),r=hi===lo?50:(cl[i]-lo)/(hi-lo)*100;k=k*2/3+r/3;d=d*2/3+k/3}K.push(k);D.push(d)}return[K,D]};
const boll=cl=>{const U=[],L=[];cl.forEach((_,i)=>{if(i<19){U.push(null);L.push(null);return}const w=cl.slice(i-19,i+1),m=w.reduce((a,b)=>a+b,0)/20,sd=Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/20);U.push(m+2*sd);L.push(m-2*sd)});return[U,L]};
const ma=(cl,n)=>cl.map((_,i)=>i+1<n?null:cl.slice(i+1-n,i+1).reduce((a,b)=>a+b,0)/n);
function starBtn(){const on=WL.has(CURC);$("mst").textContent=on?"★ 已自選":"☆ 加入自選";$("mst").classList.toggle("primary",on)}

function draw(){
  const full=CUR,N=Math.min(RNG,full.length),off=full.length-N,cl=full.map(x=>x[1]),sl=a=>a.slice(off);
  $("rg").innerHTML=[[22,"1個月"],[66,"3個月"],[130,"全部"]].map(([n,t])=>`<button data-n="${n}" class="btn sm ${n===RNG?"primary":""}">${t}</button>`).join("");
  $("sb").innerHTML='<span class="meta">副圖：</span>'+[["vol","成交量"],["macd","MACD"],["kd","KD"]].map(([k,t])=>`<button data-s="${k}" class="btn sm ${k===SUB?"primary":""}">${t}</button>`).join("")+`<button data-b="1" class="btn sm ${BOLL?"primary":""}">布林通道</button>`;
  const M=[[5,"#f59e0b"],[20,"#60a5fa"],[60,"#c084fc"]].map(([n,col])=>[n,col,sl(ma(cl,n))]);
  const E12=ema(cl,12),E26=ema(cl,26),DIF=E12.map((v,i)=>v-E26[i]),SIG=ema(DIF,9);
  const dd=sl(DIF),ss=sl(SIG),oo=dd.map((v,i)=>v-ss[i]),[K0,D0]=kdArr(cl),kk=sl(K0),dk=sl(D0),[BU,BL]=boll(cl),bu=sl(BU),bl=sl(BL);
  const D=full.slice(off),p=D.map(x=>x[1]);

  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const W=860,L=48,R=8,PT=10,PB=262,VT=292,VB=360,st=(W-L-R)/Math.max(N-1,1);
  const X=i=>L+i*st,Y=v=>PB-(v-lo)/(hi-lo)*(PB-PT),bw=Math.max((W-L-R)/N*.7,1);
  const line=(a,Yf,col,dash)=>{const pts=a.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Yf(v).toFixed(1)}`).filter(Boolean).join(" ");return pts?`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.3" ${dash?'stroke-dasharray="4 3"':""}/>`:""};

  g+=`<text x="${L}" y="${VT-4}" font-size="11" fill="var(--mu)">${{vol:"成交量",macd:"MACD（橘＝DIF，藍＝訊號線，柱＝差值）",kd:"KD（橘＝K，藍＝D）"}[SUB]}</text>`;
  if(SUB==="vol"){const vm=Math.max(...D.map(x=>x[2]),1);D.forEach((x,i)=>{const up=i===0||x[1]>=D[i-1][1],h=x[2]/vm*(VB-VT);g+=`<rect x="${X(i)-bw/2}" y="${VB-h}" width="${bw}" height="${h}" fill="var(${up?"--up":"--dn"})" opacity=".55"/>`})}
  else if(SUB==="macd"){const mx=Math.max(1e-9,...dd.concat(ss,oo).map(Math.abs)),zy=(VT+VB)/2,Ys=v=>zy-v/mx*(VB-VT)/2;
    g+=`<line x1="${L}" x2="${W-R}" y1="${zy}" y2="${zy}" stroke="var(--bd)"/>`;
    oo.forEach((v,i)=>{g+=`<rect x="${X(i)-bw/2}" y="${Math.min(zy,Ys(v))}" width="${bw}" height="${Math.abs(Ys(v)-zy)}" fill="var(${v>=0?"--up":"--dn"})" opacity=".6"/>`});
    g+=line(dd,Ys,"#f59e0b")+line(ss,Ys,"#60a5fa")}
  else{const Ys=v=>VB-v/100*(VB-VT);[20,80].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Ys(v)}" y2="${Ys(v)}" stroke="var(--mu)" stroke-dasharray="3" opacity=".5"/><text x="${L-6}" y="${Ys(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${v}</text>`);
    g+=line(kk,Ys,"#f59e0b")+line(dk,Ys,"#60a5fa")}
  if(BOLL)g+=line(bu,Y,"#94a3b8",1)+line(bl,Y,"#94a3b8",1);

  g+=`<polyline points="${p.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--tx)" stroke-width="1.8"/>`;
  [0,Math.floor((N-1)/2),N-1].forEach((i,k)=>g+=`<text x="${X(i)}" y="${VB+16}" text-anchor="${k==0?"start":k==2?"end":"middle"}" font-size="11" fill="var(--mu)">${D[i][0]}</text>`);
  g+=`<line id="cx" y1="${PT}" y2="${VB}" stroke="var(--mu)" stroke-dasharray="3" style="display:none"/>`;
  $("ch").innerHTML=`<svg id="sv" viewBox="0 0 ${W} 380" width="100%" style="display:block;touch-action:none">${g}</svg>`;
  const sv=$("sv"),f=(v,d=2)=>v==null?"–":v.toFixed(d);
  const mv=e=>{const b=sv.getBoundingClientRect(),t=e.touches?e.touches[0].clientX:e.clientX;
    let i=b.width?Math.round(((t-b.left)/b.width*W-L)/st):N-1;i=Math.max(0,Math.min(N-1,isNaN(i)?N-1:i));

    const sub=SUB==="vol"?`成交量 ${Math.round(D[i][2]/1000).toLocaleString()} 張`:SUB==="macd"?`DIF ${f(dd[i])}　訊號 ${f(ss[i])}　柱 ${f(oo[i])}`:`K ${f(kk[i],1)}　D ${f(dk[i],1)}`;
    $("tip").innerHTML=`${D[i][0]}　收盤 <b>${D[i][1].toFixed(2)}</b>　${sub}　`+M.map(m=>`<span style="color:${m[1]}">${m[0]}MA ${f(m[2][i])}</span>`).join("　")+(BOLL?`　布林 ${f(bl[i])}～${f(bu[i])}`:"")};
  sv.onmousemove=mv;sv.ontouchmove=mv;mv({clientX:sv.getBoundingClientRect().right});

async function detail(s){
  const f=(x,d=2)=>x==null?"–":x.toFixed(d),pc=x=>x==null?"–":(x>0?"+":"")+x.toFixed(1)+"%",n0=x=>x==null?"–":x.toLocaleString();
  const it=[["本益比",f(s.pe,1)],["殖利率",s.dy==null?"–":f(s.dy)+"%"],["股價淨值比",f(s.pb)],["最新EPS"+(s.eq?`（${s.eq}）`:""),f(s.eps)],
