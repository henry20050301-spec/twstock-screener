name: daily-update
on:
  schedule:
    - cron: "30 7 * * 1-5"   # UTC 07:30 = 台北 15:30（收盤後）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance pandas
      - run: python fetch_data.py   # 找不到 history.json 時會自動回補歷史
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update $(date -u +%F)" && git pull --rebase && git push)
